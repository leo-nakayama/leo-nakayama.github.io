site_name: Leo's Lyceum Vault
site_url: https://leo-nakayama.github.io/

theme:
  name: material
  features:
    - navigation.sections     # group top-level sections in the sidebar
    - navigation.expand       # expand the full tree on load
    - navigation.path         # show breadcrumb path
    - navigation.tabs         # optional: put top-level groups as tabs
    - toc.integrate           # optional: move page ToC into the left nav (can feel “denser”)
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo

extra_css:
  - css/nav-tweaks.css
  - css/jp-typography.css

plugins:
  - search

# SEO: let crawlers know there’s a JP section too (hreflang links)
extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja

nav:
- Home: index.md
- Reflective Computing:
  - Overview: reflective-computing/index.md
  - Synthetic Naikan: reflective-computing/synthetic-naikan.md
  - Aristotelian Biodome: reflective-computing/aristotelian-biodome.md
  - Dialectic Modes: reflective-computing/dialectic-modes.md
  - Manifesto: reflective-computing/reflective-computing-manifesto.md
- Projects:
  - Relational Aesthetics Consulting Blueprint: projects/relational-aesthetics-consulting-blueprint.md
  - FOWL: projects/FOWL.md
  - DSL Inference App: projects/dsl-inference-app.md
- Essays:
  - How to Get Started With FOWL Playbook Coding: essays/how-to-start-fowl-playbook-coding.md
- Notes:
  - Kokutai from Edo to Now: notes/Kokutai-from-edo-to-now.md
  - Psychological Economy of Abenomics: notes/Psychological-Economy-of-Abenomics.md
  - Configuring SSH Key-based Authentication: notes/Configuring-SSH-Key-based-Authentication.md
  - Create Basic Python Environment: notes/Create-Basic-Python-Environment-then-start-from-red.md
  - Console, Terminal, Shell, Job, and Process: notes/console-terminal-shell.md
  - Fodeora MAC Address Randomization Issue: notes/Fedora_MAC_Address_Randomization_Issue.md
  - Mermaid Recovery Checklist: notes/mermaid-recovery-checklist.md
  - PreSonus Cancel Guide: notes/presonus-cancel-guide.md
  - Fcitx5 Setup (KDE/Ubuntu): notes/fcitx5-setup.md
  - Fedora Samba Permissions: notes/fedora-samba-permissions.md
  - GitHub Action vs AWS CI/CD: notes/github-actions-vs-aws-cicd.md
- Meta:
  - Content Update Protocol: meta/content-update-protocol.md

# 👇 New Japanese Section
- 日本語:
  - ホーム: ja/index.md
  - 考察:
      - 文脈依存性の不一致と国家安全保障: ja/essays/high-context-and-low-context.md
      - Reflective Computing概要: ja/essays/reflective-computing.md
      - 構造的自己と経験的自己: ja/essays/ai-and-self.md
      - 隻手の声とAIの自己分離: ja/essays/sekishu-experiment.md
      - 日本が輸出する新たな知財: ja/essays/philosophical-export.md
      - ベノミクス的インフレ構造の継続: ja/essays/abenomics-inflation.md
  - Observation Report:
      - 日本語版レポート一覧: ja/reports/index.md
      - 高文脈文化と安全保障　DSLレポート: ja/reports/high-context-low-context-report.md
      - アベノミクス的インフレ構造 - DSLレポート: ja/reports/abenomics-inflation-exec.md

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - toc:
      permalink: true

extra:
  social:
  - icon: material/linkedin
    link: https://www.linkedin.com/in/leonakayama/
  - icon: material/github
    link: https://github.com/leo-nakayama/

