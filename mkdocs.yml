site_name: Leo's Lyceum Vault
site_url: https://leo-nakayama.github.io/

theme:
  name: material
  features:
    - navigation.sections     # group top-level sections in the sidebar
    - navigation.expand       # expand the full tree on load
    - navigation.path         # show breadcrumb path
    - navigation.tabs         # optional: put top-level groups as tabs
    - toc.integrate           # optional: move page ToC into the left nav (can feel “denser”)
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

extra_css:
  - css/nav-tweaks.css
  - css/jp-typography.css

plugins:
  - search

# SEO: let crawlers know there’s a JP section too (hreflang links)
extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja

